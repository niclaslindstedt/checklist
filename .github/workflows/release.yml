name: Release

# Manual-only. The maintainer dispatches this and the workflow derives
# the semver bump from the changeset fragments in .changes/unreleased/
# (their front-matter carries the Added/Changed/Fixed/... type and an
# optional `breaking: true` — see scripts/release/compute-bump.mjs),
# then consumes those fragments into a new CHANGELOG section, bumps
# package.json, tags vX.Y.Z, pushes, creates a GitHub Release, then
# chains into pages.yml so the new tag is served at `/` (and the same
# code at `/preview/` because main now matches the tag) without waiting
# for the next push.
#
# `bump` defaults to `auto` — the fragment-derived bump above. Set it to
# an explicit patch/minor/major only to override that derivation.
#
# `commit` is normally empty — the release is cut from main HEAD and
# the release commit is fast-forwarded onto main. Set it to a sha or
# ref to cut a release from an earlier commit when main has since
# advanced with changes not meant for this release: the workflow then
# builds the version-bump + changelog commit on top of that commit,
# tags it, and pushes ONLY the tag (main is left untouched, because
# the release commit is not a fast-forward of HEAD). Reconciling main
# afterwards — bumping its version and consuming the same fragments —
# is the maintainer's job.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump. 'auto' derives it from the .changes/unreleased/ fragments (breaking → major, Added/Changed/Removed/Deprecated → minor, Fixed/Security → patch). Pick patch/minor/major to override."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      commit:
        description: "Optional commit sha or ref to release from. Defaults to main HEAD. Use to cut a release from an earlier commit when main has advanced past it."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify clean working tree
        run: |
          if ! git diff --quiet || ! git diff --quiet --cached; then
            echo "::error::working tree is not clean — refusing to release"
            git status
            exit 1
          fi

      # When `commit` is set, detach onto that commit so the bump,
      # changelog collation, and build below all run against its tree
      # rather than main HEAD. Reinstall deps so the build matches the
      # commit's lockfile.
      - name: Check out target commit
        if: inputs.commit != ''
        run: |
          git checkout --detach "${{ inputs.commit }}"
          git --no-pager log -1 --oneline

      - name: Reinstall deps for target commit
        if: inputs.commit != ''
        run: npm ci

      # Resolve the effective bump. `auto` (the default) derives it from
      # the changeset fragments' front-matter so the release needs no
      # human judgement; an explicit patch/minor/major from the dispatch
      # form overrides that derivation.
      - name: Resolve bump
        id: resolve
        run: |
          if [ "${{ inputs.bump }}" = "auto" ] || [ -z "${{ inputs.bump }}" ]; then
            BUMP=$(node scripts/release/compute-bump.mjs)
            echo "Auto-derived bump from fragments: $BUMP"
          else
            BUMP="${{ inputs.bump }}"
            echo "Using requested bump override: $BUMP"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          # Compute the next version from the highest released tag, not
          # from package.json. A release cut from an explicit `commit`
          # pushes ONLY the tag and leaves main's package.json untouched
          # (see the "Commit + tag" step below), so trusting package.json
          # here would bump from a stale base — e.g. a later `minor` after
          # a tag-only v1.0.0 would regress to 0.x instead of 1.1.0.
          # Reconciling package.json to the latest tag first makes the
          # version monotonic with what was actually released.
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$LATEST_TAG" ]; then
            npm version "${LATEST_TAG#v}" --no-git-tag-version --allow-same-version >/dev/null
          fi
          NEW=$(npm version ${{ steps.resolve.outputs.bump }} --no-git-tag-version)
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped from ${LATEST_TAG:-package.json} to $NEW"

      - name: Collate changelog
        run: node scripts/release/collate-changelog.mjs "${{ steps.bump.outputs.version }}"

      # The notes are the changelog section plus a line about the macOS
      # download, because what opening it takes depends on the signing:
      # without a Developer ID certificate the app is signed ad hoc and not
      # notarized (see tauri/README.md), and Gatekeeper refuses the first
      # launch. NOTARIZED is the same condition the `desktop` job's signing
      # turns on.
      - name: Extract release-notes body
        env:
          NOTARIZED: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' }}
        run: |
          node scripts/release/extract-section.mjs "${{ steps.bump.outputs.version }}" > .release-notes.md
          if [ "$NOTARIZED" = "true" ]; then
            cat >> .release-notes.md <<'NOTES'

          ---

          **macOS:** the `.dmg` is signed and notarized by Apple — it opens
          like any other app.
          NOTES
          else
            cat >> .release-notes.md <<'NOTES'

          ---

          **macOS:** the `.dmg` is signed but not notarized, so the first
          launch is refused. Open **System Settings → Privacy & Security**,
          scroll to the message about the app and choose **Open Anyway**.
          macOS remembers after that.
          NOTES
          fi

      - name: Sanity build
        run: npm run build
        env:
          VITE_BASE: /
          # Mirror the deploy env (pages.yml) so this build is representative.
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          VITE_DROPBOX_APP_FOLDER: ${{ secrets.VITE_DROPBOX_APP_FOLDER }}
          VITE_DONATE_URL: ${{ secrets.VITE_DONATE_URL }}

      - name: Commit + tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          FROM_COMMIT: ${{ inputs.commit }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md .changes/unreleased
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "Release ${TAG}"
          if [ -z "$FROM_COMMIT" ]; then
            git push origin HEAD:main
          else
            echo "Releasing from ${FROM_COMMIT} — pushing the tag only, leaving main untouched."
          fi
          git push origin "$TAG"

      # A DRAFT, and the `publish` job at the bottom is what makes it public —
      # once every platform's installers are attached to it. Published here
      # instead, the release would be visible the moment the tag exists, which
      # is many minutes before three desktop runners finish and regardless of
      # whether they succeed at all: a Windows packaging failure
      # (`fail-fast: false`, so the other two carry on) would leave a public
      # release whose Windows download simply is not there, and the people who
      # find it are the ones who came to download the app.
      #
      # Idempotent on purpose: the tag is already pushed by the step above, so a
      # bare `gh release create` that fails (or a re-run after one did) would
      # leave a tagged version with no release at all. Creating-or-updating
      # makes the recovery GitHub's own "re-run failed jobs", which replays this
      # job against the version already in `steps.bump.outputs` rather than
      # cutting a second one — and the edit deliberately does NOT pass
      # `--draft`, so re-running against a release that is already public
      # refreshes its notes instead of retracting it.
      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --title "$TAG" --notes-file .release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file .release-notes.md
          fi

  # THE DOWNLOADS. One runner per platform, because each packages the app for
  # its own OS and an installer has to be built where the app was: an `.msi`
  # and `.exe` on Windows, a `.dmg` on macOS, a `.deb` and an `.AppImage` on
  # Linux.
  #
  # It checks out the TAG rather than main, so what ships is exactly what was
  # released — the tag names the release commit, which carries the changelog and
  # the bumped `package.json`, and `tauri.conf.json` reads its version straight
  # out of that file.
  desktop:
    needs: release
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    permissions:
      # contents: write — the installers are uploaded onto the GitHub Release.
      contents: write
      # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
      packages: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: ./.github/actions/package-desktop
        with:
          target: ${{ matrix.target }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          display-name: ${{ secrets.APP_DISPLAY_NAME }}
          bundle-id: ${{ secrets.APP_BUNDLE_ID }}
          release: "true"
          # macOS SIGNING — optional, but the build is never left unsigned.
          #
          # Apple Silicon refuses to execute unsigned arm64 code and reports it
          # to the user as "the app is damaged", so an unsigned arm64 download
          # is not a download at all. Tauri therefore signs AD HOC with no
          # certificate: the app runs natively and the user answers one
          # Gatekeeper prompt. Set the six secrets (tauri/README.md) and the
          # same job signs with the Developer ID and notarizes.
          mac-certificate: ${{ secrets.MAC_CSC_LINK }}
          mac-certificate-password: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          mac-sign-identity: ${{ secrets.MAC_SIGN_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          # Without the key the packaged app has no Dropbox app to sign in
          # to. The desktop signs in through the shell's loopback listener, so
          # that Dropbox app must also allow http://127.0.0.1:53682/ … :53684/.
          dropbox-app-key: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          dropbox-app-folder: ${{ secrets.VITE_DROPBOX_APP_FOLDER }}

      # Whatever this platform's bundler produced, BY EXTENSION — a step that
      # listed filenames would silently upload nothing the day a target changed
      # its suffix, and `if-no-files-found` has no equivalent here.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          assets=(tauri/target/release/bundle/**/*.{dmg,deb,AppImage,exe,msi})
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::${{ matrix.target }} produced no distributable files"
            ls -R tauri/target/release/bundle || true
            exit 1
          fi
          printf 'uploading %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber

  # THE RELEASE BECOMES VISIBLE HERE, and nowhere else: `needs: desktop` means
  # every platform in the matrix has packaged AND uploaded before anybody can
  # see the release page. If one target fails, the draft stays a draft — a
  # release missing a download is a bug report from every user on that
  # platform, and the fix (re-dispatch, or upload the installer by hand) is
  # much cheaper while nobody has seen it yet.
  publish:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    permissions:
      # contents: write — this is the flag flip on the release itself.
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "published asset: \(.name)"'


  deploy:
    # Chain straight into pages.yml so the new tag is served at `/`
    # immediately — without this, deployment would wait for the next
    # push to main (and `pages.yml`'s tag-resolution would already
    # find the new tag the push-trigger of release's own commit
    # creates, but the explicit chain is clearer and avoids any race).
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}
    permissions:
      # pages.yml declares `contents: write` at the top level because its
      # build job force-pushes the /branch/ slot to the `branch-deploy`
      # orphan branch. A reusable workflow can't be granted fewer
      # permissions than it requests, so granting only `contents: read`
      # here fails the whole Release run at startup before any job runs.
      contents: write
      pages: write
      id-token: write
    secrets: inherit
